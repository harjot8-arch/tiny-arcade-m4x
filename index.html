:root{--ink:#4F2F27;--cream:#FFF3E6;--pink:#F8688A;--blush:#FFB3C6;--gold:#FFDC9A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b1d2e;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;color:var(--ink)}
#c{position:absolute;display:block;touch-action:none}
.ov{position:fixed;inset:0;display:none;z-index:20}
.ov.on{display:flex}
button{font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.btn{background:var(--blush);border:3px solid var(--ink);border-radius:20px;padding:6px 22px 4px;font-size:clamp(16px,4.6vh,24px);box-shadow:0 5px 0 var(--ink);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;line-height:1.25}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--gold)}.btn.ghost{background:var(--cream)}
.btn:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
#title{align-items:center;padding-left:max(6vw,env(safe-area-inset-left))}
#title .col{display:flex;flex-direction:column;gap:max(1.4vh,8px);align-items:flex-start;max-width:46vw}
h1{margin:0;font-weight:800;font-size:clamp(34px,13vh,92px);line-height:.86;color:var(--cream);letter-spacing:-.02em;-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .06em 0 var(--ink);transform:rotate(-3deg);transform-origin:left bottom}
h1 em{font-style:normal;color:var(--blush)}
.sub{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(18px,5.6vh,32px);color:var(--cream);margin:0 0 1vh 4px;text-shadow:0 2px 0 var(--ink),0 0 12px #2b1d2e}
.row{display:flex;gap:12px;flex-wrap:wrap}
#menu,#notes{align-items:center;justify-content:center;background:#2b1d2eb3}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:26px;padding:16px 22px 18px;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;gap:9px;min-width:min(420px,80vw);max-height:92vh;overflow:auto}
.card h2{margin:0;font-size:clamp(20px,6vh,30px);font-weight:800}
.tg{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:clamp(14px,4vh,19px)}
.tg button{min-width:112px;background:var(--gold);border:3px solid var(--ink);border-radius:14px;padding:1px 12px 0;font-size:inherit;box-shadow:0 3px 0 var(--ink)}
.tg button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.nt{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(17px,4.6vh,24px);line-height:1.1;background:#fffaf2;border:2px dashed #d9b9a0;border-radius:12px;padding:6px 10px}
#rot{position:fixed;inset:0;z-index:99;background:#2b1d2e;color:var(--cream);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:22px;text-align:center}
#rot i{display:block;width:34px;height:60px;border:5px solid var(--cream);border-radius:10px;position:relative;animation:tilt 1.6s ease-in-out infinite}#rot i:after{content:'';position:absolute;left:50%;bottom:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--blush)}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
/* touch controls */
#ctl{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
body.play #ctl{display:block}
#ctl *{pointer-events:auto;touch-action:none}
.tb{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid var(--ink);background:#fff3e6c9;color:var(--ink);font-weight:800;box-shadow:0 4px 0 #4f2f2780;padding:0;transition:transform .08s,background .08s}

<script>
'use strict';
/* ===== settings ===== */
const SAVE_KEY='bubu.rescue.v1';
let SV={lv:0,notes:[],done:0,deaths:0};
let S={music:1,sfx:1,ctl:'stick',q:'cozy'};
try{const a=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');if(a.SV)SV=Object.assign(SV,a.SV);if(a.S)S=Object.assign(S,a.S)}catch(_){}
const save=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify({SV,S}))}catch(_){}};

/* ===== audio engine (all synthesised, zero files) ===== */
let AC=null,MB,SB,FX,NBUF;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){return}
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;comp.connect(AC.destination);
  MB=AC.createGain();SB=AC.createGain();MB.connect(comp);SB.connect(comp);
  applyVol();
  // soft echo send for the music
  FX=AC.createGain();FX.gain.value=.3;const d=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();
  d.delayTime.value=.34;fb.gain.value=.38;lp.type='lowpass';lp.frequency.value=2200;
  FX.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(MB);
  NBUF=AC.createBuffer(1,AC.sampleRate*.6|0,AC.sampleRate);const nd=NBUF.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
}
function applyVol(){if(!AC)return;MB.gain.value=S.music?.5:0;SB.gain.value=S.sfx?.8:0}
const mtof=m=>440*2**((m-69)/12);
function nt(dest,t,m,dur,type,g,o){o=o||{};const os=AC.createOscillator(),ga=AC.createGain();os.type=type;os.frequency.value=mtof(m);
  let n=os;if(o.lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);n=f}
  if(o.vib){os.detune.setValueAtTime(0,t);os.detune.linearRampToValueAtTime(o.vib,t+dur)}
  ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(g,t+(o.a||.008));ga.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(ga);ga.connect(dest);os.start(t);os.stop(t+dur+.05)}
function noise(dest,t,dur,g,type,f,f2){const s=AC.createBufferSource();s.buffer=NBUF;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const ga=AC.createGain();ga.gain.setValueAtTime(g,t);ga.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(ga);ga.connect(dest);s.start(t,Math.random()*.2);s.stop(t+dur+.02)}
function tone(f0,f1,dur,type,g,delay,dest){if(!AC||!S.sfx)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),ga=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  ga.gain.setValueAtTime(g||.3,t);ga.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(ga);ga.connect(dest||SB);o.start(t);o.stop(t+dur+.02)}
function nz(dur,g,type,f,f2,delay){if(!AC||!S.sfx)return;noise(SB,AC.currentTime+(delay||0),dur,g,type,f,f2)}
const SFX={
  punch(){tone(190,60,.12,'sine',.5);nz(.07,.35,'bandpass',1400,500)},
  kick(){tone(130,40,.18,'sine',.65);nz(.12,.4,'bandpass',900,300)},
  big(){tone(110,35,.3,'sine',.8);nz(.2,.5,'bandpass',1200,200);tone(520,900,.12,'triangle',.15)},
  whoosh(){nz(.09,.12,'bandpass',500,1800)},
  jump(){tone(330,720,.14,'sine',.22)},
  land(){tone(120,70,.07,'sine',.2)},
  hurt(){tone(620,180,.28,'triangle',.4);nz(.1,.2,'bandpass',700,300)},
  pop(){tone(400,1100,.18,'sine',.3);tone(800,1600,.14,'triangle',.18,.05);nz(.12,.15,'highpass',4000)},
  waffle(){[523,659,784,1046].forEach((f,i)=>tone(f,0,.14,'triangle',.22,i*.07))},
  heart(){tone(988,1318,.1,'sine',.12)},
  note(){tone(880,0,.5,'sine',.22);tone(1320,0,.6,'sine',.18,.1);tone(1760,0,.7,'sine',.1,.2)},
  spin(){nz(.5,.35,'lowpass',400,3000);tone(300,900,.45,'sawtooth',.08)},
  burst(){[261,329,392,523,659].forEach((f,i)=>tone(f,f*1.01,.9,'sine',.2,i*.03));nz(.6,.3,'lowpass',300,5000)},
  roar(){tone(95,55,.55,'sawtooth',.28);nz(.45,.3,'lowpass',500,150)},
  zap(){tone(1400,200,.2,'sawtooth',.15);nz(.15,.25,'highpass',3000)},
  throw(){nz(.1,.18,'bandpass',900,2500);tone(300,500,.08,'triangle',.12)},
  ui(){tone(660,880,.07,'triangle',.18)},
  tick(){tone(780+Math.random()*260,0,.025,'square',.025)},
  sel(){tone(520,780,.1,'triangle',.22);tone(780,1040,.12,'triangle',.2,.08)},
  win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0,.4,'triangle',.22,i*.12))},
  kiss(){tone(900,1500,.08,'sine',.25);tone(1200,1900,.1,'sine',.22,.12)},

};
const sfx=n=>{if(AC&&S.sfx)SFX[n]&&SFX[n]()};

/* ===== music: tiny step sequencer, 6 moods ===== */
const _=null;
const rep=(a,n)=>{let o=[];for(let i=0;i<n;i++)o=o.concat(a);return o};
const TR={
 cute:{bpm:84,spb:2,len:32,parts:[
  {w:'sine',g:.17,dur:2.6,a:.004,seq:[76,_,79,_,76,_,72,_, 72,_,76,_,81,_,76,_, 77,_,81,_,77,_,72,_, 74,_,79,_,83,_,79,_]},

  {w:'sine',g:.05,dur:2,seq:[_,_,84,_,_,_,88,_, _,_,84,_,_,_,81,_, _,_,89,_,_,_,84,_, _,_,86,_,_,_,91,_]}]},
 love:{bpm:96,spb:2,len:32,parts:[
  {w:'sine',g:.19,dur:2.8,a:.004,seq:[79,_,84,_,83,_,79,_, 79,_,83,_,86,_,83,_, 81,_,84,_,88,_,84,_, 77,_,81,_,84,_,81,_]},
  {w:'triangle',g:.11,dur:3.6,seq:[48,_,55,_,48,_,55,_, 43,_,50,_,43,_,50,_, 45,_,52,_,45,_,52,_, 41,_,48,_,41,_,48,_]},
  {w:'sine',g:.06,dur:2,seq:[72,76,79,84,79,76,72,76, 71,74,79,83,79,74,71,74, 69,72,76,81,76,72,69,72, 65,69,72,77,72,69,65,69]},
  {w:'sine',g:.04,dur:8,a:.5,seq:[64,_,_,_,_,_,_,_, 62,_,_,_,_,_,_,_, 60,_,_,_,_,_,_,_, 60,_,_,_,_,_,_,_]}]},
 sad:{bpm:60,spb:2,len:32,parts:[
  {w:'sine',g:.15,dur:3.6,a:.03,lp:1800,seq:[76,_,_,_,72,_,69,_, 72,_,_,_,69,_,65,_, 67,_,_,72,_,76,_,_, 71,_,68,_,64,_,_,_]},
  {w:'triangle',g:.09,dur:7,a:.2,lp:700,seq:[45,_,_,_,_,_,_,_, 41,_,_,_,_,_,_,_, 48,_,_,_,_,_,_,_, 40,_,_,_,_,_,_,_]},
  {w:'sine',g:.05,dur:8,a:.8,seq:[57,_,_,_,_,_,_,_, 53,_,_,_,_,_,_,_, 55,_,_,_,_,_,_,_, 56,_,_,_,_,_,_,_]}]},
 spy:{bpm:122,spb:4,len:64,parts:[
  {w:'sawtooth',g:.06,dur:2.2,lp:1700,a:.006,seq:[64,_,_,66,_,_,67,_,_,66,_,_,64,_,_,_, 64,_,_,66,_,_,67,_,_,71,_,_,69,_,_,_, 64,_,_,66,_,_,67,_,_,66,_,_,64,_,_,_, 71,_,69,_,67,_,66,_,64,_,_,_,_,_,_,_]},
  {w:'sawtooth',g:.1,dur:1.6,lp:520,seq:rep([40,_,40,_,_,40,43,_,40,_,40,_,43,_,42,_],4)},
  {w:'square',g:.022,dur:1,lp:2400,seq:rep([_,_,_,_,64,_,_,_,_,_,_,_,67,_,_,_],4)},
  {perc:'k',seq:rep([1,_,_,_,_,_,_,_,1,_,_,_,_,_,_,_],4)},
  {perc:'s',seq:rep([_,_,_,_,1,_,_,_,_,_,_,_,1,_,_,_],4)},
  {perc:'h',seq:rep([1,_,1,_],16)}]},
 boss:{bpm:150,spb:4,len:64,trans:3,parts:[
  {w:'sawtooth',g:.07,dur:1.2,lp:2000,a:.005,seq:[64,_,64,66,_,67,_,64,_,66,_,67,_,71,_,_, 64,_,64,66,_,67,_,71,_,69,_,67,_,66,_,_, 64,_,64,66,_,67,_,64,_,66,_,67,_,71,_,_, 76,_,74,_,71,_,69,_,67,_,66,_,64,_,_,_]},
  {w:'sawtooth',g:.11,dur:1,lp:600,seq:rep([40,40,_,40,40,_,43,_],8)},
  {perc:'k',seq:rep([1,_,_,_,1,_,_,_],8)},
  {perc:'s',seq:rep([_,_,_,_,_,_,_,_,1,_,_,_,_,_,_,_],4)},
  {perc:'h',seq:rep([1,_],32)}]},
 tense:{bpm:70,spb:2,len:32,parts:[
  {w:'sawtooth',g:.07,dur:12,a:1.2,lp:380,seq:[38,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_, 37,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]},
  {perc:'k',seq:[1,_,_,_,_,_,1,_,_,_,_,_,_,_,_,_, 1,_,_,_,_,_,1,_,_,_,_,_,_,_,_,_]},
  {w:'sine',g:.05,dur:3,seq:[_,_,_,_,_,_,_,_,_,_,_,_,86,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,85,_]}]}
};
let cur=null,nextT=0,tmr=0;
function music(name){
  if(!AC||(cur&&cur.name===name))return;
  const now=AC.currentTime;
  if(cur){cur.out.gain.cancelScheduledValues(now);cur.out.gain.setTargetAtTime(0,now,.3);const o=cur.out;setTimeout(()=>{try{o.disconnect()}catch(_){}},2500)}
  if(!name){cur=null;return}
  const out=AC.createGain();out.gain.value=0;out.gain.setTargetAtTime(1,now,.5);out.connect(MB);out.connect(FX);
  cur={name,tr:TR[name],out,step:0};nextT=now+.1;
  if(!tmr)tmr=setInterval(tick,30);
}
function tick(){
  if(!cur||!AC||AC.state!=='running')return;
  const tr=cur.tr,sd=60/tr.bpm/tr.spb;
  while(nextT<AC.currentTime+.18){
    for(const p of tr.parts){const v=p.seq[cur.step%p.seq.length];if(v==null)continue;
      if(p.perc){percT(cur.out,nextT,p.perc)}
      else nt(cur.out,nextT,v+(tr.trans||0),p.dur*sd,p.w,p.g,p)}
    cur.step=(cur.step+1)%tr.len;nextT+=sd;
  }
}
function percT(d,t,k){
  if(k==='k'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(d);o.start(t);o.stop(t+.18)}
  else if(k==='s')noise(d,t,.1,.16,'bandpass',1800)
  else noise(d,t,.03,.045,'highpass',7000)
}
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});

'use strict';
/* ===== drawing kit ===== */
const OUT='#4F2F27',H=360,GY=290;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),ease=t=>t*t*(3-2*t);
const TAU=6.2832;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function E(g,x,y,rx,ry,f,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,TAU);if(f){g.fillStyle=f;g.fill()}g.stroke()}
function F(g,x,y,rx,ry,f,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,TAU);g.fillStyle=f;g.fill()}
function rrp(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function RR(g,x,y,w,h,r,f,st){rrp(g,x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(st!==0)g.stroke()}
const HP=new Path2D();HP.moveTo(0,.95);HP.bezierCurveTo(-1.7,-.1,-1.25,-1.15,-.55,-1.15);HP.bezierCurveTo(-.2,-1.15,0,-.9,0,-.6);HP.bezierCurveTo(0,-.9,.2,-1.15,.55,-1.15);HP.bezierCurveTo(1.25,-1.15,1.7,-.1,0,.95);HP.closePath();
const SPK=new Path2D();SPK.moveTo(0,-1);SPK.quadraticCurveTo(.14,-.14,1,0);SPK.quadraticCurveTo(.14,.14,0,1);SPK.quadraticCurveTo(-.14,.14,-1,0);SPK.quadraticCurveTo(-.14,-.14,0,-1);
function heart(g,x,y,s,col,a,rot){g.save();g.translate(x,y);if(rot)g.rotate(rot);g.scale(s,s);if(a!=null)g.globalAlpha=a;g.fillStyle=col;g.fill(HP);g.restore()}
function heartO(g,x,y,s,col){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=col;g.fill(HP);g.lineWidth=2/s;g.strokeStyle=OUT;g.stroke(HP);g.restore()}
function sparkle(g,x,y,s,col,a,rot){g.save();g.translate(x,y);if(rot)g.rotate(rot);g.scale(s,s);if(a!=null)g.globalAlpha=a;g.fillStyle=col;g.fill(SPK);g.restore()}
function mk(w,h,k,fn){const c=document.createElement('canvas');c.width=Math.ceil(w*k);c.height=Math.ceil(h*k);const g=c.getContext('2d');g.scale(k,k);g.lineJoin='round';g.lineCap='round';fn(g,w,h);return c}
function glow(r,col){return mk(r*2,r*2,1,(g)=>{const q=g.createRadialGradient(r,r,0,r,r,r);q.addColorStop(0,col);q.addColorStop(1,'transparent');g.fillStyle=q;g.fillRect(0,0,r*2,r*2)})}
function wrapT(g,t,mw){const w=t.split(' ');let l='',o=[];for(const s of w){const n=l?l+' '+s:s;if(g.measureText(n).width>mw&&l){o.push(l);l=s}else l=n}if(l)o.push(l);return o}

/* ===== the bears: same palette + outline as the Us app avatars ===== */
const BK='#4C2920';
